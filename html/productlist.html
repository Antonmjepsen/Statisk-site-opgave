<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Produktliste</title>
  </head>
  <body>
    <header></header>
    <main class="productlist-page">
      <section class="product-grid-section">
        <h2 class="h2_main">Produkter</h2>
        <div class="product-grid">
          <a class="product-card" href="product.html">
            <img
              src="https://kea-alt-del.dk/t7/images/webp/640/1532.webp"
              alt="Produktbillede"
            />
            <div class="product-card-content">
              <h3>Logo shirt</h3>
              <p>Brand: Puma</p>
              <p>Pris: 299 kr.</p>
            </div>
          </a>

          <a class="product-card" href="product.html">
            <img
              src="https://kea-alt-del.dk/t7/images/webp/640/1164.webp"
              alt="Produktbillede"
            />
            <div class="product-card-content">
              <h3>Jersey</h3>
              <p>Brand: Sahara</p>
              <p>Pris: 249 kr.</p>
            </div>
          </a>

          <a class="product-card" href="product.html">
            <span class="tilbud">Tilbud</span>
            <img
              src="https://kea-alt-del.dk/t7/images/webp/640/1533.webp"
              alt="Produktbillede"
            />
            <div class="product-card-content">
              <h3>Produktnavn 3</h3>
              <p>Brand: Brand 3</p>
              <p>Pris: 699 kr.</p>
            </div>
          </a>

          <a class="product-card" href="product.html">
            <img
              src="https://kea-alt-del.dk/t7/images/webp/640/1525.webp"
              alt="Produktbillede"
            />
            <div class="product-card-content">
              <h3>Produktnavn 4</h3>
              <p>Brand: Brand 4</p>
              <p>Pris: 899 kr.</p>
            </div>
          </a>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
